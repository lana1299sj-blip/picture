<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2333;--sub:#6b7488;--line:#dfe4ec;--acc:#2f5bea;--acc-d:#2447bd;--acc-s:#e8eefd;--danger:#d64545;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:4px 0 0;letter-spacing:.02em}
.hint{color:var(--sub);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;margin:0 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;min-height:44px;padding:0 16px}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc-d)}
button:disabled{opacity:.45;cursor:not-allowed}
.drop{border:2px dashed #b9c3d6;border-radius:var(--r);background:#fafbfd;text-align:center;padding:26px 16px;display:grid;gap:10px;justify-items:center;transition:.15s}
.drop.over{border-color:var(--acc);background:var(--acc-s)}
.drop p{margin:0;color:var(--sub);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.thumb.drag{opacity:.4}.thumb.target{outline:3px solid var(--acc)}
.thumb .img{aspect-ratio:1;background:#eef1f6 center/cover no-repeat;position:relative;cursor:grab}
.thumb .no{position:absolute;left:6px;top:6px;background:rgba(28,35,51,.78);color:#fff;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.thumb .ops{display:grid;grid-template-columns:repeat(3,1fr)}
.thumb .ops button{border:0;border-top:1px solid var(--line);border-radius:0;min-height:42px;padding:0;font-size:16px}
.thumb .ops button+button{border-left:1px solid var(--line)}
.thumb .ops .del{color:var(--danger)}
.layouts{display:flex;flex-wrap:wrap;gap:10px}
.lay{display:grid;gap:6px;justify-items:center;padding:10px 12px;min-width:92px;min-height:76px;border-radius:12px}
.lay svg{width:40px;height:40px}
.lay span{font-size:13px}
.lay[aria-pressed=true]{border-color:var(--acc);background:var(--acc-s);color:var(--acc-d);font-weight:600}
.stage{background:repeating-conic-gradient(#eef1f6 0 25%,#f8f9fb 0 50%) 0 0/16px 16px;border-radius:12px;padding:10px;display:grid;place-items:center;overflow:auto}
canvas#view{max-width:100%;height:auto;display:block;box-shadow:0 1px 6px rgba(20,30,60,.18);background:#fff}
.meta{color:var(--sub);font-size:13px;margin:10px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:64px}
.seg button[aria-pressed=true]{background:var(--acc-s);color:var(--acc-d);font-weight:600}
.row .primary{flex:1;min-width:180px;font-size:17px;min-height:52px}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(15,20,35,.72);display:none;z-index:10;padding:16px;overflow:auto}
.sheet.on{display:grid;place-items:center}
.sheet .box{background:#fff;border-radius:16px;padding:16px;max-width:560px;width:100%;display:grid;gap:12px}
.sheet img{width:100%;border-radius:8px;-webkit-touch-callout:default;user-select:auto}
.sheet p{margin:0;font-size:14px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90vw}
@media(max-width:560px){body{padding:10px}.card{padding:12px}.lay{flex:1 1 calc(50% - 10px)}.thumbs{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>多圖合併工具</h1>
    <p class="hint">選好圖片，自動排版成一張圖。所有處理都在你的瀏覽器內完成，不會上傳。</p>
  </header>

  <section class="card">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="選擇圖片">
      <button class="primary" id="pick" type="button">選擇圖片</button>
      <p>可一次多選，電腦也可直接把圖片拖曳到這裡</p>
      <input id="file" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.heic,.heif" multiple hidden>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="card" id="layoutCard" hidden>
    <h2>版型</h2>
    <div class="layouts" id="layouts"></div>
  </section>

  <section class="card" id="outCard" hidden>
    <h2>預覽與下載</h2>
    <div class="stage"><canvas id="view"></canvas></div>
    <p class="meta" id="meta"></p>
    <div class="row">
      <div class="seg" role="group" aria-label="輸出格式">
        <button type="button" id="fJpg" aria-pressed="true">JPG</button>
        <button type="button" id="fPng" aria-pressed="false">PNG</button>
      </div>
      <button class="primary" id="dl" type="button">下載合併圖片</button>
    </div>
  </section>
</main>

<div class="sheet" id="sheet">
  <div class="box">
    <img id="sheetImg" alt="合併結果">
    <p>手機請長按圖片，選「儲存到相簿」；也可使用下方按鈕。</p>
    <button class="primary" id="shareBtn" type="button">儲存／分享</button>
    <button id="sheetClose" type="button">關閉</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const MAX_SIDE = 2400;        // 單張圖載入後最長邊上限
const MAX_OUT_W = 2400;       // 格狀版型輸出寬度上限
const MAX_OUT_H = 12000;      // 輸出高度上限
const MAX_PIXELS = 16e6;      // 輸出總像素上限（保護手機記憶體）

const $ = id => document.getElementById(id);
const items = [];             // {id, cv, w, h, thumb}
let uid = 0, chosen = null, fmt = 'jpg', lastBlob = null;

/* ---------- 版型定義 ---------- */
// 格狀：回傳以「格」為單位的矩形
function gridRects(cols, rows, n){
  const out = [];
  for(let r=0;r<rows;r++){
    const cnt = r < rows-1 ? cols : n - (rows-1)*cols;
    if(cnt<=0) continue;
    const w = cols/cnt;
    for(let c=0;c<cnt;c++) out.push({x:c*w,y:r,w,h:1});
  }
  return {cols,rows,list:out.slice(0,n)};
}
const L = {
  g12:{label:'左右並排',make:n=>gridRects(2,1,n)},
  g21:{label:'上下拼接',make:n=>gridRects(1,2,n)},
  l1r2:{label:'左1右2',make:()=>({cols:2,rows:2,list:[{x:0,y:0,w:1,h:2},{x:1,y:0,w:1,h:1},{x:1,y:1,w:1,h:1}]})},
  t1b2:{label:'上1下2',make:()=>({cols:2,rows:2,list:[{x:0,y:0,w:2,h:1},{x:0,y:1,w:1,h:1},{x:1,y:1,w:1,h:1}]})},
  g13:{label:'橫向三格',make:n=>gridRects(3,1,n)},
  g31:{label:'直向三格',make:n=>gridRects(1,3,n)},
  g22:{label:'2×2 四宮格',make:n=>gridRects(2,2,n)},
  t1b3:{label:'上1下3',make:()=>({cols:3,rows:2,list:[{x:0,y:0,w:3,h:1},{x:0,y:1,w:1,h:1},{x:1,y:1,w:1,h:1},{x:2,y:1,w:1,h:1}]})},
  g14:{label:'橫向四格',make:n=>gridRects(4,1,n)},
  g41:{label:'直向四格',make:n=>gridRects(1,4,n)},
  auto:{label:'自動網格',make:n=>{const c=Math.ceil(Math.sqrt(n));return gridRects(c,Math.ceil(n/c),n);}},
  vstack:{label:'直向長圖',stack:'v'},
  hstack:{label:'橫向長圖',stack:'h'}
};
const OPTIONS = {
  2:['g12','g21'], 3:['l1r2','t1b2','g13','g31'], 4:['g22','t1b3','g14','g41']
};
function optionsFor(n){ return n<2 ? [] : (OPTIONS[n] || ['auto','vstack','hstack']); }
function currentKey(){
  const opts = optionsFor(items.length);
  if(!opts.length) return null;
  return opts.includes(chosen) ? chosen : opts[0];
}

/* ---------- 版面計算（像素） ---------- */
function plan(){
  const n = items.length; if(!n) return null;
  const key = currentKey();
  if(n===1){ const it=items[0]; return {W:it.w,H:it.h,draws:[{i:0,x:0,y:0,w:it.w,h:it.h,mode:'contain'}]}; }
  const def = L[key];
  if(def.stack){
    let W,H,draws=[],v=def.stack==='v';
    let base = Math.min(v?items[0].w:items[0].h, MAX_SIDE);
    const sizes = items.map(it=> v ? {w:base,h:base*it.h/it.w} : {w:base*it.w/it.h,h:base});
    let tw = v ? base : sizes.reduce((s,z)=>s+z.w,0);
    let th = v ? sizes.reduce((s,z)=>s+z.h,0) : base;
    let k = Math.min(1, Math.sqrt(MAX_PIXELS/(tw*th)), MAX_OUT_H/Math.max(tw,th)*(v?1:1));
    if(!v) k = Math.min(k, 8000/tw);
    let pos=0;
    sizes.forEach((z,i)=>{
      const a=Math.round(pos*k), b=Math.round((pos+(v?z.h:z.w))*k);
      draws.push(v?{i,x:0,y:a,w:Math.round(tw*k),h:b-a,mode:'contain'}:{i,x:a,y:0,w:b-a,h:Math.round(th*k),mode:'contain'});
      pos += v?z.h:z.w;
    });
    W = Math.round(tw*k); H = Math.round(th*k);
    return {W,H,draws};
  }
  // 格狀：格子長寬比取圖片平均比例（限制在 0.7～1.5），圖片以 Contain 完整置入格內
  const avg = items.reduce((s,it)=>s+it.w/it.h,0)/n;
  const a = Math.min(1.5, Math.max(0.7, avg));
  const g = def.make(n);
  const uw = g.cols*a, uh = g.rows;
  let s = MAX_OUT_W/uw;
  s = Math.min(s, MAX_OUT_H/uh, Math.sqrt(MAX_PIXELS/(uw*uh)));
  const W = Math.round(uw*s), H = Math.round(uh*s);
  const draws = g.list.map((r,i)=>{
    const x0=Math.round(r.x*a*s), x1=Math.round((r.x+r.w)*a*s);
    const y0=Math.round(r.y*s),   y1=Math.round((r.y+r.h)*s);
    return {i,x:x0,y:y0,w:x1-x0,h:y1-y0,mode:'contain'};
  });
  return {W,H,draws};
}

/* ---------- 繪製 ---------- */
function paint(cv, p, f){
  cv.width = Math.max(1,Math.round(p.W*f)); cv.height = Math.max(1,Math.round(p.H*f));
  const c = cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height);
  c.imageSmoothingQuality='high';
  for(const d of p.draws){
    const src = items[d.i].cv, sw=src.width, sh=src.height;
    const dx=Math.round(d.x*f), dy=Math.round(d.y*f);
    const dw=Math.round((d.x+d.w)*f)-dx, dh=Math.round((d.y+d.h)*f)-dy;
    if(dw<=0||dh<=0) continue;
    // Contain：等比例縮放、完整顯示、置中，其餘保持白底
    const k=Math.min(dw/sw,dh/sh);
    const rw=Math.max(1,Math.round(sw*k)), rh=Math.max(1,Math.round(sh*k));
    c.drawImage(src,0,0,sw,sh,dx+Math.round((dw-rw)/2),dy+Math.round((dh-rh)/2),rw,rh);
  }
}

/* ---------- 介面更新 ---------- */
function icon(key){
  const def=L[key]; let rects, cols, rows;
  if(def.stack){
    const v=def.stack==='v';
    cols=v?1:3; rows=v?3:1;
    rects=v?[{x:0,y:0,w:1,h:1},{x:0,y:1,w:1,h:1},{x:0,y:2,w:1,h:1}]:[{x:0,y:0,w:1,h:1},{x:1,y:0,w:1,h:1},{x:2,y:0,w:1,h:1}];
  } else { const g=def.make(key==='auto'?5:(optionsFor(items.length).length?items.length:2)); cols=g.cols;rows=g.rows;rects=g.list; }
  const u=36/Math.max(cols,rows), ox=(40-cols*u)/2, oy=(40-rows*u)/2;
  return '<svg viewBox="0 0 40 40" aria-hidden="true">'+rects.map(r=>`<rect x="${ox+r.x*u+1.2}" y="${oy+r.y*u+1.2}" width="${r.w*u-2.4}" height="${r.h*u-2.4}" rx="2" fill="currentColor" opacity=".8"/>`).join('')+'</svg>';
}
function render(){
  const n=items.length, key=currentKey();
  // 縮圖列表
  const t=$('thumbs');
  t.innerHTML='';
  items.forEach((it,i)=>{
    const el=document.createElement('div'); el.className='thumb'; el.draggable=true; el.dataset.i=i;
    el.innerHTML=`<div class="img" style="background-image:url('${it.thumb}')"><span class="no">${i+1}</span></div>
      <div class="ops"><button type="button" data-a="up" aria-label="上移" ${i===0?'disabled':''}>↑</button>
      <button type="button" data-a="down" aria-label="下移" ${i===n-1?'disabled':''}>↓</button>
      <button type="button" class="del" data-a="del" aria-label="刪除">✕</button></div>`;
    t.appendChild(el);
  });
  // 版型按鈕
  const opts=optionsFor(n);
  $('layoutCard').hidden = !opts.length;
  const lw=$('layouts'); lw.innerHTML='';
  opts.forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.className='lay'; b.dataset.k=k;
    b.setAttribute('aria-pressed',k===key);
    b.innerHTML=icon(k)+`<span>${L[k].label}</span>`;
    lw.appendChild(b);
  });
  $('outCard').hidden = !n;
  if(n) preview();
}
function preview(){
  const p=plan(); if(!p) return;
  const stage=$('view').parentElement;
  const avail=Math.max(200,stage.clientWidth-20);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const f=Math.min(1,(avail*dpr)/p.W, 1400/Math.max(p.W,p.H));
  paint($('view'),p,f);
  $('view').style.width=Math.min(avail,p.W)+'px';
  $('meta').textContent=`輸出尺寸：${p.W} × ${p.H} px（共 ${items.length} 張）`;
}

/* ---------- 載入圖片 ---------- */
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600);}
function loadOne(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const k=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*k)), h=Math.max(1,Math.round(img.naturalHeight*k));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const c=cv.getContext('2d'); c.imageSmoothingQuality='high'; c.drawImage(img,0,0,w,h);
      const tk=240/Math.max(w,h), tc=document.createElement('canvas');
      tc.width=Math.round(w*tk); tc.height=Math.round(h*tk);
      tc.getContext('2d').drawImage(cv,0,0,tc.width,tc.height);
      URL.revokeObjectURL(url);
      res({id:++uid,cv,w,h,thumb:tc.toDataURL('image/jpeg',.7)});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(file.name));};
    img.src=url;
  });
}
async function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name));
  if(!files.length){toast('沒有可用的圖片檔');return;}
  toast('載入中…');
  let fail=0;
  for(const f of files){ try{ items.push(await loadOne(f)); }catch{ fail++; } }
  render();
  toast(fail?`有 ${fail} 張無法讀取（格式不支援）`:'已加入 '+(files.length-fail)+' 張');
}

/* ---------- 事件 ---------- */
$('pick').onclick=e=>{e.stopPropagation();$('file').click();};
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}};
$('file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();$('drop').classList.add('over');}
}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  if(ev==='dragleave'&&e.relatedTarget) return;
  $('drop').classList.remove('over');
}));
document.addEventListener('drop',e=>{
  if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();addFiles(e.dataTransfer.files);}
});

const move=(i,j)=>{if(j<0||j>=items.length||i===j)return;const [x]=items.splice(i,1);items.splice(j,0,x);render();};
$('thumbs').onclick=e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const i=+b.closest('.thumb').dataset.i, a=b.dataset.a;
  if(a==='up') move(i,i-1); else if(a==='down') move(i,i+1); else {items.splice(i,1);render();}
};
let dragFrom=null;
$('thumbs').addEventListener('dragstart',e=>{
  const el=e.target.closest('.thumb'); if(!el) return;
  dragFrom=+el.dataset.i; el.classList.add('drag');
  e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','reorder');
});
$('thumbs').addEventListener('dragover',e=>{
  if(dragFrom===null) return; e.preventDefault();
  document.querySelectorAll('.thumb.target').forEach(x=>x.classList.remove('target'));
  e.target.closest('.thumb')?.classList.add('target');
});
$('thumbs').addEventListener('drop',e=>{
  if(dragFrom===null) return; e.preventDefault(); e.stopPropagation();
  const el=e.target.closest('.thumb'); const from=dragFrom; dragFrom=null;
  if(el) move(from,+el.dataset.i); else render();
});
$('thumbs').addEventListener('dragend',()=>{dragFrom=null;render();});

$('layouts').onclick=e=>{const b=e.target.closest('.lay');if(!b)return;chosen=b.dataset.k;render();};
$('fJpg').onclick=()=>setFmt('jpg'); $('fPng').onclick=()=>setFmt('png');
function setFmt(f){fmt=f;$('fJpg').setAttribute('aria-pressed',f==='jpg');$('fPng').setAttribute('aria-pressed',f==='png');}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>items.length&&preview(),150);});

/* ---------- 匯出 ---------- */
const isTouch = matchMedia('(pointer:coarse)').matches;
$('dl').onclick=async()=>{
  const p=plan(); if(!p) return;
  const btn=$('dl'); btn.disabled=true; btn.textContent='合併中…';
  await new Promise(r=>setTimeout(r,30));
  try{
    const cv=document.createElement('canvas'); paint(cv,p,1);
    const type=fmt==='png'?'image/png':'image/jpeg';
    const blob=await new Promise(r=>cv.toBlob(r,type,.92));
    cv.width=cv.height=1;
    if(!blob) throw new Error('toBlob');
    lastBlob=blob;
    const name='merged-'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+(fmt==='png'?'.png':'.jpg');
    lastBlob.fname=name;
    if(isTouch) openSheet(blob); else saveBlob(blob,name);
  }catch(err){
    toast('輸出失敗：圖片太大或記憶體不足，請減少張數再試');
  }finally{btn.disabled=false;btn.textContent='下載合併圖片';}
};
function saveBlob(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
let sheetUrl=null;
function openSheet(blob){
  if(sheetUrl) URL.revokeObjectURL(sheetUrl);
  sheetUrl=URL.createObjectURL(blob);
  $('sheetImg').src=sheetUrl; $('sheet').classList.add('on');
}
$('sheetClose').onclick=()=>$('sheet').classList.remove('on');
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on');};
$('shareBtn').onclick=async()=>{
  if(!lastBlob) return;
  const file=new File([lastBlob],lastBlob.fname,{type:lastBlob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
  }catch(e){ if(e.name==='AbortError') return; }
  saveBlob(lastBlob,lastBlob.fname);
};
render();
})();
</script>
</body>
</html>
